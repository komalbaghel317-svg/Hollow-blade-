<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hollow Requiem: Abyssal Blade</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background: #020307;
      overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e2e8f0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #gameWrapper {
      position: relative;
      width: 100%;
      max-width: 1100px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 0 60px rgba(56, 189, 248, 0.2), 0 0 120px rgba(168, 85, 247, 0.1);
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      background: #030712;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #uiLayer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .hud-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }
    .status-card {
      background: rgba(10, 15, 30, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 8px;
      padding: 10px 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      min-width: 240px;
    }
    .status-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .bar-bg {
      width: 100%;
      height: 12px;
      background: #0f172a;
      border-radius: 6px;
      border: 1px solid #334155;
      overflow: hidden;
      position: relative;
    }
    .bar-fill {
      height: 100%;
      width: 100%;
      transition: width 0.1s ease-out;
    }
    #pHealthFill {
      background: linear-gradient(90deg, #0284c7, #38bdf8, #a855f7);
      box-shadow: 0 0 12px #38bdf8;
    }
    #bHealthFill {
      background: linear-gradient(90deg, #dc2626, #f97316, #fbbf24);
      box-shadow: 0 0 14px #ef4444;
    }
    .controls-overlay {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 12px;
      color: #94a3b8;
      backdrop-filter: blur(4px);
      width: fit-content;
      line-height: 1.6;
    }
    .key-badge {
      color: #38bdf8;
      font-weight: bold;
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    #touchControls {
      display: none;
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      justify-content: space-between;
      pointer-events: auto;
    }
    .touch-btn {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.8);
      border: 2px solid #38bdf8;
      color: #38bdf8;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    @media (pointer: coarse) {
      #touchControls { display: flex; }
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <canvas id="stage" width="1280" height="720"></canvas>

    <div id="uiLayer">
      <div class="hud-top">
        <div class="status-card">
          <div class="status-title" style="color: #38bdf8;">
            <span>Shadow Vessel</span>
            <span id="pHealthText">100 / 100</span>
          </div>
          <div class="bar-bg">
            <div id="pHealthFill" class="bar-fill"></div>
          </div>
        </div>

          <div class="status-title" style
